apiVersion: 1
providers:
  - name: AlfaGen
    orgId: 1
    folder: AlfaGen
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana-dashboards
  - name: alfagen-logs
    orgId: 1
    folder: AlfaGen
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana-logs
