pid /var/run/nginx.pid;
worker_processes auto;

events {}

http {
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path /var/cache/nginx/proxy_temp;
  access_log /dev/stdout;
  error_log /dev/stderr notice;

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_client_certificate /etc/nginx/client-ca/ca.crt;
    ssl_crl /etc/nginx/client-ca/ca.crl;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 2m;

    location = /process {
      limit_except POST { deny all; }
      proxy_pass http://proxy:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      # Never trust identity headers supplied by the caller. The backend still
      # requires its per-system API key as an independent second factor.
      proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
      proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
    }

    location = /v1/generate {
      limit_except POST { deny all; }
      proxy_pass http://proxy:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
      proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
    }

    # MVP smoke probes are exposed through TLS; metrics and test capture are
    # deliberately not routed by this edge.
    location = /live { proxy_pass http://proxy:8080; }
    location = /ready { proxy_pass http://proxy:8080; }

    location / { return 404; }
  }
}
